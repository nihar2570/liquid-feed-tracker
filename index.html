<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feed Tracker</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js for Trends -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- iOS App Icon and Fullscreen Mode -->
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Feed Log">

</head>
<body>
  <!-- LOGIN OVERLAY -->
  <div id="login-overlay" class="login-overlay" style="display: none;">
    <div class="ios-card login-card">
      <h2 class="page-title" style="margin-top: 0; margin-bottom: 8px; font-size: 26px; text-align: center;">Welcome</h2>
      <p style="color: var(--ios-text-muted); text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 14px;">Sign in to log feeds</p>
      <div class="input-group">
        <input type="text" id="login-user" placeholder="User ID" class="ios-input" autocomplete="username" />
        <input type="password" id="login-pass" placeholder="Password" class="ios-input" autocomplete="current-password" />
      </div>
      <div id="login-error" class="login-error"></div>
      <button id="login-btn" class="ios-button">Sign In</button>
    </div>
  </div>

  <div class="app-container">
    
    <!-- HOME TAB -->
    <div id="home-tab" class="tab-content active">
      
      <!-- Header with Theme Toggle (Replaces the old h1 completely) -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h1 class="page-title" style="margin-bottom: 0;">Feed Tracker</h1>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button id="user-btn" class="user-badge" title="Tap to switch user">👤 --</button>
          <button id="theme-btn" class="theme-btn">🌙</button>
        </div>
      </div>

      <!-- Full-Width Today Banner with Progress -->
      <div class="today-banner">
        <div class="banner-header">
          <span class="banner-label">Today's Total <span class="banner-goal">(Goal: 700 ml)</span></span>
          <span id="today-total" class="banner-value">0 ml</span>
        </div>
        <!-- Progress Bar (Goal: 700ml) -->
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <!-- Progress Sub-info (Remaining & %) -->
        <div class="progress-sub-info">
          <div class="percent-group">
            <span id="progress-percent">0%</span>
            <span id="day-elapsed" class="day-elapsed-text">(0% of day completed)</span>
          </div>
          <span id="progress-remaining">700 ml left</span>
        </div>
        <!-- Time Since Last Feed -->
        <div id="last-feed-info" class="last-feed-text">Last fed: --</div>
      </div>
      
      <div class="ios-card">
        <div class="input-group">
          <div class="time-row">
            <input type="datetime-local" id="feed-time" class="ios-input" />
            <button type="button" id="now-btn" class="chip-btn now-btn">Now</button>
          </div>
          <div class="input-clear-wrapper">
            <input type="number" id="feed-amount" placeholder="Amount in ml" class="ios-input" />
            <button type="button" id="clear-amount-btn" class="clear-btn" aria-label="Clear amount">✕</button>
          </div>
          <div class="quick-chips" id="quick-chips">
            <button type="button" class="chip-btn" data-set="60">60ml</button>
            <button type="button" class="chip-btn" data-set="90">90ml</button>
            <button type="button" class="chip-btn" data-set="120">120ml</button>
            <button type="button" class="chip-btn chip-step chip-minus" data-delta="-5">- 5ml</button>
            <button type="button" class="chip-btn chip-step chip-plus" data-delta="5">+ 5ml</button>
          </div>
        </div>
        <button id="add-btn" class="ios-button">Add Feed</button>
        <div id="edit-actions" class="edit-actions" style="display: none;">
          <button type="button" id="cancel-edit-btn" class="secondary-btn">Cancel</button>
          <button type="button" id="delete-feed-btn" class="danger-btn">🗑️ Delete</button>
        </div>
      </div>

      <h2 class="section-title" style="margin-top: 24px;">Recent Logs</h2>
      <div id="logs-container">
        <div class="ios-card"><p style="color: var(--ios-text-muted); margin: 0;">Loading...</p></div>
      </div>
    </div>
    
    <!-- TRENDS TAB -->
    <div id="trends-tab" class="tab-content">
      <h1 class="page-title">Trends</h1>
      
      <div class="segmented-control" id="timeframe-controls">
        <button class="segment-btn active" data-days="7">1 Week</button>
        <button class="segment-btn" data-days="14">2 Weeks</button>
        <button class="segment-btn" data-days="28">4 Weeks</button>
      </div>

      <!-- Summary Stats Grid -->
      <div class="stats-grid">
        <div class="ios-card stat-card">
          <div class="stat-label">Daily Avg</div>
          <div class="stat-value" id="stat-daily-avg">--</div>
        </div>
        <div class="ios-card stat-card">
          <div class="stat-label">Avg / Feed</div>
          <div class="stat-value" id="stat-feed-avg">--</div>
        </div>
        <div class="ios-card stat-card">
          <div class="stat-label">Feeds / Day</div>
          <div class="stat-value" id="stat-feeds-day">--</div>
        </div>
      </div>

      <div class="ios-card chart-container">
        <canvas id="trendsChart"></canvas>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-button active" onclick="switchTab('home')">Home</button>
    <button class="nav-button" onclick="switchTab('trends')">Trends</button>
  </nav>

  <!-- FIREBASE & APP LOGIC -->
  <script type="module" src="app.js"></script>
  
  <!-- TAB SWITCHING LOGIC -->
  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabName + '-tab').classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
